# SPDX-License-Identifier: GPL-3.0-or-later
#
# SayRat workspace manifest.
#
# Phase 1 declares structure and only pins dependencies that are actually
# used by the stub crates. Future phases add approved crates from AGENTS.md
# when they first become necessary.

[workspace]
resolver = "2"
members = [
    "crates/sayrat-protocol",
    "crates/sayratd",
    "crates/sayrat-ui",
]

[workspace.package]
version      = "0.1.0"
# Edition 2024 requires Rust 1.85+. The workspace pins a concrete floor so
# CI cache keys and downstream packagers have something stable to assert.
# MSRV increases require an explicit PR note (AGENTS.md §2.1).
edition      = "2024"
license      = "GPL-3.0-or-later"
repository   = "https://github.com/AQSAMA/SayRat"
homepage     = "https://github.com/AQSAMA/SayRat"
authors      = ["SayRat Contributors"]
rust-version = "1.92"

# Centralised dependency catalogue. Do not pre-pin the whole approved stack;
# add approved crates here when a phase first uses them and keep features
# minimal (AGENTS.md §7).
[workspace.dependencies]
anyhow = { version = "1.0" }
pico-args = { version = "0.5" }
tracing = { version = "0.1", default-features = false, features = ["attributes"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["ansi", "env-filter", "fmt", "std"] }

# Release profile tuned for the AGENTS.md §3 memory budget.
#   - lto = "fat":      whole-program inlining, removes unreachable code.
#   - codegen-units = 1: maximises LTO effectiveness.
#   - panic = "abort":   removes unwinding tables.
#   - strip = "symbols": strips debug + symbol tables from final artefacts.
#   - opt-level = "z":   optimises for the smallest binary size.
[profile.release]
lto             = "fat"
codegen-units   = 1
panic           = "abort"
strip           = "symbols"
opt-level       = "z"
debug           = false
incremental     = false
overflow-checks = false
